[package]
name = "claude-hub"
version = "0.1.0"
description = "Claude Hub - 本地开发调度中心通知面板"
authors = ["hengjun-dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
chrono = "0.4"

# release 模式精简二进制 + 去除调试符号，配合 .cargo/config.toml 的路径重映射保护用户名隐私
[profile.release]
strip = "symbols"
opt-level = 3
codegen-units = 1
