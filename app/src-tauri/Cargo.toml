[package]
name = "claude-hub"
version = "0.1.0"
description = "Claude Hub - 本地开发调度中心通知面板"
authors = ["hengjun-dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
chrono = "0.4"
