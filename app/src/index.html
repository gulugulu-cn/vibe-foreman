<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Claude Hub</h1>
      <div class="tabs">
        <button class="tab active" data-tab="projects" onclick="switchTab('projects')">项目</button>
        <button class="tab" data-tab="usage" onclick="switchTab('usage')">用量</button>
      </div>
      <span class="status-badge" id="globalStatus">就绪</span>
    </header>

    <!-- 依赖检查（仅当有缺失才显示） -->
    <section class="deps-panel" id="depsPanel" style="display:none"></section>

    <!-- 项目视图 -->
    <div id="projectsView" class="view active">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索项目..." autocomplete="off" spellcheck="false">
        <button class="icon-btn" title="扫描 ~/Documents/code 下的 git 项目" onclick="scanProjects()">⟳ 扫描</button>
      </div>

      <section class="projects" id="projectList">
        <div class="empty">加载中...</div>
      </section>
    </div>

    <!-- 用量视图 -->
    <div id="usageView" class="view" style="display:none">
      <div class="usage-summary" id="usageSummary"></div>
      <div class="usage-range">
        <button class="range-btn" data-range="7d" onclick="loadUsage('7d')">7天</button>
        <button class="range-btn" data-range="30d" onclick="loadUsage('30d')">30天</button>
        <button class="range-btn active" data-range="all" onclick="loadUsage('all')">全部</button>
      </div>
      <div class="usage-list" id="usageList">
        <div class="empty">加载中...</div>
      </div>
    </div>

    <section class="events">
      <h2>最近通知</h2>
      <div id="eventList">
        <div class="empty">等待通知...</div>
      </div>
    </section>
  </div>

  <!-- 右键/点击菜单 -->
  <div class="context-menu" id="contextMenu" style="display:none">
    <div class="menu-item" onclick="menuAction('claude')">📟 Claude Code</div>
    <div class="menu-item" onclick="menuAction('claude-skip')">⚡ Claude Code (跳过权限)</div>
    <div class="menu-item" onclick="menuAction('terminal')">💻 终端</div>
    <div class="menu-item separator"></div>
    <div class="menu-item" onclick="menuAction('finder')">📁 Finder</div>
    <div class="menu-item" onclick="menuAction('vscode')">🔧 VS Code</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
