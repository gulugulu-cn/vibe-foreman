<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Claude Hub</h1>
      <span class="status-badge" id="globalStatus">就绪</span>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索项目..." autocomplete="off" spellcheck="false">
    </div>

    <section class="projects" id="projectList">
      <div class="empty">加载中...</div>
    </section>

    <section class="events">
      <h2>最近通知</h2>
      <div id="eventList">
        <div class="empty">等待通知...</div>
      </div>
    </section>
  </div>

  <!-- 右键/点击菜单 -->
  <div class="context-menu" id="contextMenu" style="display:none">
    <div class="menu-item" onclick="menuAction('claude')">📟 Claude Code</div>
    <div class="menu-item" onclick="menuAction('claude-skip')">⚡ Claude Code (跳过权限)</div>
    <div class="menu-item" onclick="menuAction('terminal')">💻 终端</div>
    <div class="menu-item separator"></div>
    <div class="menu-item" onclick="menuAction('finder')">📁 Finder</div>
    <div class="menu-item" onclick="menuAction('vscode')">🔧 VS Code</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
